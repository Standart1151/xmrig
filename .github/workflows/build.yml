name: Build Windows XMRig

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and extract dependencies
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\deps" -Force | Out-Null
        # Скачиваем релиз зависимостей через GitHub CLI
        gh release download --repo xmrig/xmrig-deps --dir "$env:RUNNER_TEMP\deps"
        
        # Находим скачанный zip архив
        $zip = (Get-ChildItem "$env:RUNNER_TEMP\deps\*.zip" | Select-Object -First 1).FullName
        Write-Host "Unpacking dependency archive: $zip"
        Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\extracted" -Force
        
        # Ищем папку, содержащую 'include'
        $incDir = (Get-ChildItem -Path "$env:RUNNER_TEMP\extracted" -Recurse -Directory -Filter "include" | Select-Object -First 1).Parent.FullName
        Write-Host "Found deps root at: $incDir"
        
        # Переносим в ..\xmrig-deps рядом с репозиторием
        $target = "$env:GITHUB_WORKSPACE\..\xmrig-deps"
        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Copy-Item -Path "$incDir\*" -Destination $target -Recurse -Force

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DXMRIG_DEPS="$env:GITHUB_WORKSPACE\..\xmrig-deps"

    - name: Build Release
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xmrig-no-donate-win64
        path: build/Release/xmrig.exe
