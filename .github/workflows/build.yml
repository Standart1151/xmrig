name: Build Windows XMRig

on:
  push:
    branches: [ "master", "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and unpack dependencies
      shell: pwsh
      run: |
        $url = "https://github.com/xmrig/xmrig-deps/releases/download/v4.4/xmrig-deps-4.4-msvc2022-win64.zip"
        Invoke-WebRequest -Uri $url -OutFile "xmrig-deps.zip"
        Expand-Archive -Path "xmrig-deps.zip" -DestinationPath "$env:GITHUB_WORKSPACE\..\xmrig-deps"

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DXMRIG_DEPS="${{ github.workspace }}\..\xmrig-deps"

    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xmrig-no-donate-win64
        path: build/Release/xmrig.exe
