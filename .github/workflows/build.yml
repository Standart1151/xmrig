name: Build Windows XMRig

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout XMRig
      uses: actions/checkout@v4
      with:
        path: xmrig

    - name: Checkout XMRig Dependencies
      uses: actions/checkout@v4
      with:
        repository: xmrig/xmrig-deps
        path: xmrig-deps

    - name: Configure CMake
      working-directory: xmrig
      run: |
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DXMRIG_DEPS="${{ github.workspace }}\xmrig-deps\msvc2022\x64"

    - name: Build Release
      working-directory: xmrig
      run: |
        cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xmrig-no-donate-win64
        path: xmrig/build/Release/xmrig.exe
