name: Build Windows XMRig

on:
  push:
    branches: [ "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and unpack dependencies
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/xmrig/xmrig-deps/releases/download/v4.4/xmrig-deps-msvc2022-x64.zip" -OutFile "xmrig-deps.zip"
        Expand-Archive -Path "xmrig-deps.zip" -DestinationPath "xmrig-deps"
        # Переносим папку с зависимостями на один уровень выше репозитория, как требует CMake
        Move-Item -Path "xmrig-deps\xmrig-deps\*" -Destination "..\xmrig-deps" -ErrorAction SilentlyContinue

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xmrig-no-donate-win64
        path: build/Release/xmrig.exe
